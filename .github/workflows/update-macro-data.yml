name: Update macro data

# The ingestion CLIs fetch official NBS (stats.gov.cn), PBOC (pbc.gov.cn), and
# GACC (customs.gov.cn) publication sources.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-macro-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and validate NBS PMI
        run: npm run ingest:pmi -- --target data/indicators/pmi.json

      - name: Prepare per-run PBOC download cache
        run: echo "MACROLENS_PBOC_CACHE_DIR=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Fetch and validate PBOC money supply
        run: npm run ingest:pboc-money-supply -- --target-dir data/indicators

      - name: Fetch and validate PBOC money supply balances
        run: npm run ingest:pboc-money-balances -- --target-dir data/chart-overlays

      - name: Fetch and validate PBOC credit and social financing
        run: npm run ingest:pboc-financial -- --target-dir data/indicators

      - name: Fetch and validate official LPR
        run: npm run ingest:lpr -- --target data/indicators/lpr.json

      - name: Fetch and validate official PBOC policy rate
        run: npm run ingest:policy-rate -- --target data/indicators/policy-rate.json

      - name: Fetch and validate NBS real-economy indicators
        run: npm run ingest:nbs-real-economy -- --target-dir data/indicators

      - name: Fetch and validate NBS price indicators
        run: npm run ingest:nbs-prices -- --target-dir data/indicators

      - name: Fetch and validate official GACC customs trade
        run: npm run ingest:customs-trade -- --target-dir data/indicators

      - name: Validate updated datasets and pages
        run: |
          npm test
          npm run check
          npm run build
          npm run test:output

      - name: Open macro data update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            data/indicators/pmi.json
            data/indicators/m0.json
            data/indicators/m1.json
            data/indicators/m2.json
            data/chart-overlays/m0-balance.json
            data/chart-overlays/m1-balance.json
            data/chart-overlays/m2-balance.json
            data/indicators/credit.json
            data/indicators/social-financing.json
            data/indicators/lpr.json
            data/indicators/policy-rate.json
            data/indicators/gdp.json
            data/indicators/industrial-production.json
            data/indicators/retail-sales.json
            data/indicators/fixed-asset-investment.json
            data/indicators/unemployment-rate.json
            data/indicators/cpi.json
            data/indicators/core-cpi.json
            data/indicators/ppi.json
            data/indicators/exports.json
            data/indicators/imports.json
          branch: automation/update-macro-data
          delete-branch: true
          commit-message: 'data: update macro indicators'
          title: 'data: update macro data'
          body: |
            Automated official macro-data update.

            The ingestion adapters validate official publication structures,
            check historical overlaps and methodology, and update only changed
            indicator datasets and money-supply balance charts.

            Monthly NBS real-economy data was checked against the latest discovered
            publication periods. Missing adjacent periods are filled only from
            verified official releases; unresolved gaps stop the workflow.

            Before opening this PR, the workflow ran npm test, npm run check,
            npm run build, and npm run test:output against the updated files.
