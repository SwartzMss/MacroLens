  <p>三、广义货币增长7.8% 2025年12月末，广义货币（M2）余额339.51万亿元，同比增长7.8%。狭义货币（M1）余额113.45万亿元，同比下降1.2%。流通中货币（M0）余额14.10万亿元，同比增长10.0%。</p>
