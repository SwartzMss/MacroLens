<h2 style="font-size: 16px;color: #333;">中国人民银行公开市场业务公告［2026］第3号</h2>
<span id="shijian">2026-06-17 10:54:00</span>
<div id="zoom" class="zoom1">
<p><span style="text-indent:0px;">为支持我国金融市场高水平对外开放，便利境外央行类机构人民币流动性管理，中国人民银行将通过境外央行类机构回购工具，向符合条件的境外央行类机构提供人民币流动性。</span></p>
<p><span style="text-indent:0px;">境外央行类机构指境外央行或货币当局、国际金融组织、主权财富基金。回购工具的操作方式包括质押式和买断式。回购债券种类包括中国国债、央行票据、政策性金融债等人民银行认可的高等级人民币债券。回购期限包括7天、1个月、3个月。回购利率在公开市场7天期逆回购操作利率上加点确定。</span></p>
<p></p>
<p align="center">中国人民银行公开市场业务操作室</p>
<p align="center">二〇二六年六月十七日</p>
</div>
